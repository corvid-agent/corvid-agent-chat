<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CorvidAgent Chat</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐦‍⬛</text></svg>">
    <style>
        /* ── Fonts ── */
        @font-face {
            font-family: 'Dogica Pixel';
            src: url('fonts/dogicapixel.ttf') format('truetype');
            font-weight: 400; font-style: normal; font-display: swap;
        }
        @font-face {
            font-family: 'Dogica Pixel';
            src: url('fonts/dogicapixelbold.ttf') format('truetype');
            font-weight: 700; font-style: normal; font-display: swap;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-deep: #0a0a12;
            --bg-surface: #0f1018;
            --bg-raised: #161822;
            --bg-input: #0c0d14;
            --bg-hover: #1a1c2e;
            --border: #1e2035;
            --border-bright: #2a2d48;
            --text-primary: #e0e0ec;
            --text-secondary: #7a7d98;
            --text-tertiary: #4a4d68;
            --accent-cyan: #00e5ff;
            --accent-cyan-dim: rgba(0, 229, 255, 0.15);
            --accent-magenta: #ff00aa;
            --accent-magenta-dim: rgba(255, 0, 170, 0.15);
            --accent-green: #00ff88;
            --accent-green-dim: rgba(0, 255, 136, 0.15);
            --accent-red: #ff3355;
            --accent-amber: #ffaa00;
            --accent-amber-dim: rgba(255, 170, 0, 0.15);
            --accent-orange: #f0883e;
            --glow-cyan: 0 0 8px rgba(0, 229, 255, 0.25);
            --glow-magenta: 0 0 8px rgba(255, 0, 170, 0.25);
            --radius-sm: 3px;
            --radius: 6px;
            --radius-lg: 8px;
            --font-pixel: 'Dogica Pixel', 'Dogica', monospace;
            --font-mono: 'SF Mono', 'Fira Code', 'JetBrains Mono', Consolas, monospace;
        }

        html, body {
            height: 100%;
            background: var(--bg-deep);
            color: var(--text-primary);
            font-family: var(--font-pixel), monospace;
            font-size: 10px;
            line-height: 1.7;
            -webkit-font-smoothing: antialiased;
        }

        ::selection { background: var(--accent-cyan-dim); color: var(--accent-cyan); }

        /* ── Layout ── */
        .app {
            display: flex;
            flex-direction: column;
            height: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 1.25rem;
            height: 52px;
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }
        .header__brand {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }
        .header__status {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--text-tertiary); flex-shrink: 0;
            transition: background 0.3s, box-shadow 0.3s;
        }
        .header__status.connected {
            background: var(--accent-green);
            box-shadow: 0 0 8px rgba(0, 255, 136, 0.4);
        }
        .header__status.error {
            background: var(--accent-red);
            box-shadow: 0 0 6px rgba(255, 51, 85, 0.4);
        }
        .header__title {
            font-size: 1.2rem; font-weight: 700;
            color: var(--accent-cyan);
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.35);
            letter-spacing: 0.08em;
        }
        .header__controls {
            display: flex; gap: 0.5rem; align-items: center;
        }
        .agent-select {
            background: var(--bg-input); color: var(--text-primary);
            border: 1px solid var(--border-bright); border-radius: var(--radius);
            padding: 0.4rem 0.6rem; font-size: 0.85rem;
            font-family: inherit; cursor: pointer; max-width: 160px;
        }
        .agent-select:focus { outline: none; border-color: var(--accent-cyan); box-shadow: var(--glow-cyan); }
        .settings-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--text-secondary); border-radius: var(--radius);
            padding: 0.35rem 0.55rem; font-size: 0.9rem; cursor: pointer;
            transition: border-color 0.2s, color 0.2s;
        }
        .settings-btn:hover { border-color: var(--accent-cyan); color: var(--accent-cyan); }

        /* ── Terminal ── */
        .terminal {
            flex: 1; display: flex; flex-direction: column;
            border-left: 1px solid var(--border);
            border-right: 1px solid var(--border);
            background: #0d1117;
            overflow: hidden; min-height: 0;
        }
        .terminal__output {
            flex: 1; padding: 1rem 1.25rem;
            overflow-y: auto; min-height: 0;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--border-bright) transparent;
        }

        /* ── Messages ── */
        .msg {
            margin-bottom: 0.6rem; word-break: break-word;
            white-space: pre-wrap; position: relative;
            padding-right: 2.5rem; line-height: 1.65;
        }
        .msg__prompt {
            font-weight: 700; user-select: none;
        }
        .msg--inbound .msg__prompt { color: var(--accent-cyan); }
        .msg--outbound .msg__prompt { color: #7ee787; }
        .msg--status .msg__prompt { color: var(--accent-amber); }
        .msg--status { opacity: 0.7; font-style: italic; }
        .msg--command .msg__prompt { color: var(--accent-magenta); }
        .msg--streaming { opacity: 0.95; }
        .msg__text { color: #c9d1d9; }

        /* Copy button */
        .msg__copy {
            position: absolute; top: 0; right: 0;
            background: transparent; border: 1px solid #30363d;
            color: #484f58; font-family: inherit;
            font-size: 0.7rem; padding: 1px 5px;
            border-radius: var(--radius-sm); cursor: pointer;
            transition: opacity 0.15s, color 0.15s;
        }
        @media (hover: hover) {
            .msg__copy { opacity: 0; }
            .msg:hover .msg__copy { opacity: 1; }
            .msg__copy:hover { color: #c9d1d9; border-color: #484f58; }
        }
        @media (hover: none) {
            .msg__copy { opacity: 0.35; }
            .msg__copy:active { opacity: 1; }
        }

        /* Blinking cursor during streaming */
        .cursor {
            display: inline-block; width: 7px; height: 1em;
            background: #7ee787; vertical-align: text-bottom;
            margin-left: 1px;
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Thinking indicator */
        .thinking {
            display: flex; align-items: center; gap: 0.5rem;
            color: #8b949e; font-size: 0.8rem; padding: 0.25rem 0;
        }
        .thinking__dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent-orange);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 0.3; transform: scale(0.8); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* Tool use (collapsible) */
        .tool {
            margin: 0.25rem 0; color: #8b949e;
        }
        .tool__name {
            cursor: pointer; font-size: 0.8rem;
            color: var(--accent-orange); user-select: none;
            list-style: none;
        }
        .tool__name::-webkit-details-marker { display: none; }
        .tool__name::before {
            content: '▸ '; font-size: 0.7rem;
        }
        .tool[open] .tool__name::before {
            content: '▾ ';
        }
        .tool__name:hover { color: #f0f6fc; }
        .tool__input {
            background: var(--bg-raised); border: 1px solid #30363d;
            border-radius: var(--radius); padding: 0.5rem;
            font-size: 0.75rem; color: #8b949e;
            overflow-x: auto; margin: 0.25rem 0 0;
            font-family: var(--font-mono);
            max-height: 200px; overflow-y: auto;
        }

        /* Approval request */
        .approval {
            background: var(--accent-amber-dim);
            border: 1px solid rgba(255, 170, 0, 0.3);
            border-radius: var(--radius);
            padding: 0.6rem 0.85rem; margin: 0.4rem 0;
        }
        .approval__text {
            color: var(--accent-amber); font-size: 0.85rem;
            margin-bottom: 0.5rem;
        }
        .approval__actions { display: flex; gap: 0.5rem; }
        .approval__btn {
            padding: 0.3rem 0.75rem; border-radius: var(--radius);
            font-size: 0.75rem; font-weight: 700; font-family: inherit;
            cursor: pointer; text-transform: uppercase;
            letter-spacing: 0.05em; transition: background 0.15s;
        }
        .approval__btn--approve {
            background: var(--accent-green-dim); color: var(--accent-green);
            border: 1px solid var(--accent-green);
        }
        .approval__btn--approve:hover { background: rgba(0, 255, 136, 0.25); }
        .approval__btn--deny {
            background: transparent; color: var(--accent-red);
            border: 1px solid var(--accent-red);
        }
        .approval__btn--deny:hover { background: rgba(255, 51, 85, 0.1); }

        /* Markdown in messages */
        .msg__text code {
            background: #161b22; padding: 1px 5px;
            border-radius: 3px; font-size: 0.85em;
            color: var(--accent-orange);
            font-family: var(--font-mono);
        }
        .msg__text pre {
            background: #161b22; padding: 0.75rem;
            border-radius: var(--radius); border: 1px solid #30363d;
            overflow-x: auto; margin: 0.5rem 0;
            font-family: var(--font-mono);
            line-height: 1.5; font-size: 0.85em;
        }
        .msg__text pre code {
            background: none; padding: 0; color: #c9d1d9;
        }
        .msg__text strong { color: #f0f6fc; font-weight: 700; }
        .msg__text em { color: var(--text-secondary); }
        .msg__text a { color: var(--accent-cyan); text-decoration: underline; }
        .msg__text a:hover { text-shadow: 0 0 6px rgba(0, 229, 255, 0.3); }
        .msg__text h1, .msg__text h2, .msg__text h3 {
            color: var(--accent-cyan); margin: 0.6rem 0 0.3rem;
            font-size: 1em; text-shadow: 0 0 8px rgba(0, 229, 255, 0.15);
        }
        .msg__text blockquote {
            border-left: 3px solid var(--accent-cyan);
            padding-left: 0.75rem; color: var(--text-secondary);
            margin: 0.3rem 0;
        }
        .msg__text ul, .msg__text ol {
            padding-left: 1.5rem; margin: 0.3rem 0;
        }
        .msg__text li { margin: 0.1rem 0; }
        .msg__text hr {
            border: none; border-top: 1px solid #30363d;
            margin: 0.6rem 0;
        }
        .msg__text table {
            border-collapse: collapse; margin: 0.5rem 0;
            font-size: 0.85em; width: 100%;
        }
        .msg__text th, .msg__text td {
            border: 1px solid #30363d; padding: 0.3rem 0.6rem;
            text-align: left;
        }
        .msg__text th {
            background: #161b22; color: var(--accent-cyan);
            font-weight: 700;
        }
        .msg__text td { color: #c9d1d9; }

        /* ── Input area ── */
        .input-area {
            display: flex; align-items: flex-start;
            border-top: 1px solid #30363d;
            padding: 0.75rem 1.25rem;
            background: #0d1117; flex-shrink: 0;
            position: relative;
        }
        .input-area__prompt {
            color: var(--accent-cyan); font-weight: 700;
            padding-top: 3px; user-select: none;
            flex-shrink: 0;
        }
        .input-area__wrapper {
            flex: 1; position: relative;
        }
        .input-area__field {
            width: 100%; background: transparent; border: none;
            color: #c9d1d9; font-family: inherit; font-size: inherit;
            line-height: inherit; resize: none; outline: none;
            padding: 0 0 0 0.3rem; min-height: 1.7em;
        }
        .input-area__field::placeholder { color: #484f58; }
        .input-area__field:disabled { opacity: 0.3; }
        .input-area__help {
            background: transparent; border: 1px solid #30363d;
            color: #484f58; font-family: inherit;
            font-size: 0.8rem; font-weight: 700;
            width: 22px; height: 22px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center;
            justify-content: center; margin-left: 0.5rem;
            margin-top: 1px; transition: color 0.15s, border-color 0.15s;
            flex-shrink: 0;
        }
        .input-area__help:hover {
            color: var(--accent-cyan); border-color: var(--accent-cyan);
        }

        /* ── Autocomplete ── */
        .autocomplete {
            position: absolute; bottom: 100%; left: 0; right: 0;
            max-height: 260px; overflow-y: auto;
            background: var(--bg-raised); border: 1px solid var(--border-bright);
            border-radius: var(--radius);
            box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.5);
            z-index: 10; margin-bottom: 4px;
            display: none;
            scrollbar-width: thin;
            scrollbar-color: var(--border-bright) transparent;
        }
        .autocomplete.visible { display: block; }
        .autocomplete__item {
            display: flex; align-items: baseline; gap: 0.75rem;
            padding: 0.45rem 0.75rem; cursor: pointer;
            transition: background 0.1s;
            border-bottom: 1px solid var(--border);
        }
        .autocomplete__item:last-child { border-bottom: none; }
        .autocomplete__item:hover, .autocomplete__item.active {
            background: var(--bg-hover);
        }
        .autocomplete__item.active {
            border-left: 2px solid var(--accent-cyan);
        }
        .autocomplete__name {
            font-weight: 700; font-size: 0.85rem;
            white-space: nowrap;
        }
        .autocomplete__item[data-kind="command"] .autocomplete__name {
            color: var(--accent-cyan);
        }
        .autocomplete__item[data-kind="agent"] .autocomplete__name {
            color: var(--accent-magenta);
        }
        .autocomplete__desc {
            color: #8b949e; font-size: 0.75rem;
            overflow: hidden; text-overflow: ellipsis;
            white-space: nowrap; flex: 1;
        }
        .autocomplete__badge {
            display: inline-block; font-size: 0.6rem; padding: 1px 5px;
            border-radius: var(--radius-sm); font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.04em;
            margin-left: 0.3rem; vertical-align: middle;
            color: var(--accent-amber); border: 1px solid rgba(255, 170, 0, 0.3);
            background: var(--accent-amber-dim);
        }

        /* ── Settings modal ── */
        .modal-backdrop {
            position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px); z-index: 1000;
            display: none; align-items: center; justify-content: center;
        }
        .modal-backdrop.visible { display: flex; }
        .modal {
            background: var(--bg-surface); border: 1px solid var(--border-bright);
            border-radius: var(--radius-lg); padding: 1.5rem;
            width: 90%; max-width: 440px; max-height: 90vh; overflow-y: auto;
        }
        .modal h2 {
            color: var(--accent-cyan); font-size: 1.2rem; margin-bottom: 1rem;
            text-shadow: 0 0 8px rgba(0, 229, 255, 0.2);
        }
        .modal label {
            display: block; color: var(--text-secondary); font-size: 0.85rem;
            margin-bottom: 0.3rem; margin-top: 0.75rem;
        }
        .modal input[type="text"], .modal input[type="url"] {
            width: 100%; background: var(--bg-input); color: var(--text-primary);
            border: 1px solid var(--border-bright); border-radius: var(--radius);
            padding: 0.55rem 0.75rem; font-size: 0.9rem; font-family: inherit;
        }
        .modal input:focus { outline: none; border-color: var(--accent-cyan); box-shadow: var(--glow-cyan); }
        .modal__actions {
            display: flex; gap: 0.5rem; margin-top: 1.25rem; justify-content: flex-end;
        }
        .modal__btn {
            padding: 0.45rem 1rem; border-radius: var(--radius);
            font-size: 0.85rem; font-weight: 700; font-family: inherit;
            cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
            transition: background 0.15s;
        }
        .modal__btn--primary {
            background: var(--accent-cyan-dim); color: var(--accent-cyan);
            border: 1px solid var(--accent-cyan);
        }
        .modal__btn--primary:hover { background: rgba(0, 229, 255, 0.25); }
        .modal__btn--secondary {
            background: transparent; color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .modal__btn--secondary:hover { background: var(--bg-hover); }
        .modal__hint {
            font-size: 0.75rem; color: var(--text-tertiary); margin-top: 0.25rem;
        }

        /* ── Empty state ── */
        .empty-state {
            flex: 1; display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            color: var(--text-tertiary); font-size: 0.95rem;
            text-align: center; padding: 2rem; gap: 1rem;
        }
        .empty-state__title {
            color: var(--accent-cyan); font-size: 1.1rem;
            text-shadow: 0 0 10px rgba(0, 229, 255, 0.25);
        }
        .empty-state__commands {
            display: flex; flex-wrap: wrap; gap: 0.4rem;
            justify-content: center; max-width: 460px;
        }
        .empty-state__cmd {
            font-family: var(--font-mono); font-size: 0.8rem;
            padding: 0.25rem 0.6rem; border-radius: var(--radius-sm);
            background: var(--bg-raised); border: 1px solid var(--border);
            color: var(--accent-magenta); cursor: pointer;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .empty-state__cmd:hover {
            border-color: var(--accent-magenta);
            box-shadow: 0 0 6px rgba(255, 0, 170, 0.2);
        }

        /* ── Scrollbar ── */
        .terminal__output::-webkit-scrollbar { width: 6px; }
        .terminal__output::-webkit-scrollbar-track { background: transparent; }
        .terminal__output::-webkit-scrollbar-thumb { background: var(--border-bright); border-radius: 3px; }
        .terminal__output::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }

        /* ── iOS safe area ── */
        @supports (padding-bottom: env(safe-area-inset-bottom)) {
            .input-area { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); }
        }

        /* ── Mobile ── */
        @media (max-width: 480px) {
            .header__title { font-size: 1rem; }
            .agent-select { max-width: 110px; font-size: 0.75rem; }
            .msg { padding-right: 1.8rem; }
            .terminal__output { padding: 0.75rem; }
            .input-area { padding: 0.6rem 0.75rem; }
        }

        /* ── Focus ── */
        button:focus-visible, select:focus-visible {
            outline: 2px solid var(--accent-cyan);
            outline-offset: 2px;
            box-shadow: var(--glow-cyan);
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Header -->
        <div class="header">
            <div class="header__brand">
                <div class="header__status" id="statusDot"></div>
                <div class="header__title">CorvidAgent</div>
            </div>
            <div class="header__controls">
                <select class="agent-select" id="agentSelect" aria-label="Select agent">
                    <option value="">Connecting...</option>
                </select>
                <button class="settings-btn" id="settingsBtn" aria-label="Settings" title="Settings">&#9881;</button>
            </div>
        </div>

        <!-- Terminal -->
        <div class="terminal">
            <div class="terminal__output" id="output">
                <div class="empty-state" id="emptyState">
                    <div class="empty-state__title">CorvidAgent</div>
                    <div>Select an agent and start chatting.</div>
                    <div style="font-size: 0.8rem;">
                        Type <code style="color: var(--accent-cyan); font-family: var(--font-mono); background: var(--bg-raised); padding: 1px 5px; border-radius: 3px;">/</code> for commands,
                        <code style="color: var(--accent-magenta); font-family: var(--font-mono); background: var(--bg-raised); padding: 1px 5px; border-radius: 3px;">@</code> to mention agents
                    </div>
                    <div class="empty-state__commands" id="commandHints"></div>
                </div>
            </div>
        </div>

        <!-- Input -->
        <div class="input-area">
            <span class="input-area__prompt">&gt;&nbsp;</span>
            <div class="input-area__wrapper">
                <div class="autocomplete" id="autocomplete"></div>
                <textarea
                    class="input-area__field"
                    id="messageInput"
                    placeholder="Type a message or /command..."
                    rows="1"
                    aria-label="Message input"
                ></textarea>
            </div>
            <button class="input-area__help" id="helpBtn" aria-label="Show commands" title="Show available commands">?</button>
        </div>
    </div>

    <!-- Settings modal -->
    <div class="modal-backdrop" id="settingsModal">
        <div class="modal">
            <h2>Connection Settings</h2>
            <label for="serverUrl">Server URL</label>
            <input type="url" id="serverUrl" placeholder="wss://your-server.com/ws">
            <div class="modal__hint">WebSocket URL (e.g. wss://example.com/ws or ws://localhost:3000/ws)</div>

            <label for="apiUrl">API URL</label>
            <input type="url" id="apiUrl" placeholder="https://your-server.com">
            <div class="modal__hint">HTTP base URL for REST API (auto-derived from WS URL if blank)</div>

            <div class="modal__actions">
                <button class="modal__btn modal__btn--secondary" id="settingsCancel">Cancel</button>
                <button class="modal__btn modal__btn--primary" id="settingsSave">Connect</button>
            </div>
        </div>
    </div>

    <script>
    (function() {
        'use strict';

        // ── Command definitions (synced from corvid-agent/shared/command-defs.ts) ──
        const COMMANDS = [
            { name: '/status',   desc: 'Show active sessions and conversation count', usage: '/status', privileged: false },
            { name: '/credits',  desc: 'Show your credit balance and rates', usage: '/credits', privileged: false },
            { name: '/history',  desc: 'Show recent credit transactions', usage: '/history [limit]', privileged: false },
            { name: '/queue',    desc: 'Show pending escalation/approval requests', usage: '/queue', privileged: false },
            { name: '/agent',    desc: 'List available agents or switch default', usage: '/agent [name]', privileged: true },
            { name: '/stop',     desc: 'Stop a running session', usage: '/stop <session-id>', privileged: true },
            { name: '/approve',  desc: 'Approve a pending escalation request', usage: '/approve <queue-id>', privileged: true },
            { name: '/deny',     desc: 'Deny a pending escalation request', usage: '/deny <queue-id>', privileged: true },
            { name: '/mode',     desc: 'View or set operational mode', usage: '/mode [normal|queued|paused]', privileged: true },
            { name: '/work',     desc: 'Create a work task (branch + PR)', usage: '/work <description>', privileged: true },
            { name: '/council',  desc: 'Launch multi-agent council discussion', usage: '/council @Agent1 @Agent2 -- <prompt>', privileged: true },
            { name: '/extend',   desc: 'Extend a running session timeout', usage: '/extend [minutes]', privileged: true },
            { name: '/help',     desc: 'Show available commands and usage', usage: '/help [command]', privileged: false },
        ];

        // ── State ──
        let ws = null;
        let currentAgentId = '';
        let isStreaming = false;
        let streamingEl = null;
        let streamBuffer = '';
        let selectedIdx = -1;
        let filteredItems = [];
        let autocompleteTrigger = null; // 'command' | 'agent' | null
        let reconnectTimer = null;
        let reconnectDelay = 1000;
        let agentNames = [];

        // ── DOM refs ──
        const outputEl = document.getElementById('output');
        const emptyState = document.getElementById('emptyState');
        const agentSelect = document.getElementById('agentSelect');
        const messageInput = document.getElementById('messageInput');
        const statusDot = document.getElementById('statusDot');
        const autocompleteEl = document.getElementById('autocomplete');
        const settingsBtn = document.getElementById('settingsBtn');
        const settingsModal = document.getElementById('settingsModal');
        const serverUrlInput = document.getElementById('serverUrl');
        const apiUrlInput = document.getElementById('apiUrl');
        const settingsSave = document.getElementById('settingsSave');
        const settingsCancel = document.getElementById('settingsCancel');
        const commandHints = document.getElementById('commandHints');
        const helpBtn = document.getElementById('helpBtn');

        // ── Settings persistence ──
        function getServerUrl() { return localStorage.getItem('corvid_ws_url') || ''; }
        function getApiUrl() { return localStorage.getItem('corvid_api_url') || ''; }
        function saveSettings(wsUrl, apiBaseUrl) {
            localStorage.setItem('corvid_ws_url', wsUrl);
            localStorage.setItem('corvid_api_url', apiBaseUrl);
        }
        function deriveApiUrl(wsUrl) {
            try {
                const u = new URL(wsUrl);
                const proto = u.protocol === 'wss:' ? 'https:' : 'http:';
                return `${proto}//${u.host}`;
            } catch { return ''; }
        }

        // ── Settings modal ──
        settingsBtn.addEventListener('click', () => {
            serverUrlInput.value = getServerUrl();
            apiUrlInput.value = getApiUrl();
            settingsModal.classList.add('visible');
            serverUrlInput.focus();
        });
        settingsCancel.addEventListener('click', () => settingsModal.classList.remove('visible'));
        settingsModal.addEventListener('click', (e) => {
            if (e.target === settingsModal) settingsModal.classList.remove('visible');
        });
        settingsSave.addEventListener('click', () => {
            const wsUrl = serverUrlInput.value.trim();
            const apiBase = apiUrlInput.value.trim() || deriveApiUrl(wsUrl);
            if (!wsUrl) { serverUrlInput.focus(); return; }
            saveSettings(wsUrl, apiBase);
            settingsModal.classList.remove('visible');
            if (ws) { ws.close(); ws = null; }
            connectWs();
            loadAgents();
        });

        // ── Command hint chips ──
        COMMANDS.filter(c => !c.privileged).forEach(cmd => {
            const chip = document.createElement('span');
            chip.className = 'empty-state__cmd';
            chip.textContent = cmd.name;
            chip.title = cmd.desc;
            chip.addEventListener('click', () => {
                messageInput.value = cmd.name + ' ';
                messageInput.focus();
                hideAutocomplete();
            });
            commandHints.appendChild(chip);
        });

        // ── Auto-resize textarea ──
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            const lines = messageInput.value.split('\n').length;
            messageInput.style.height = Math.min(Math.max(lines, 1), 6) * 1.7 + 'em';
            handleAutocomplete();
        });

        // ── Key handling ──
        messageInput.addEventListener('keydown', (e) => {
            if (autocompleteEl.classList.contains('visible') && filteredItems.length > 0) {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    selectedIdx = (selectedIdx + 1) % filteredItems.length;
                    updateAutocompleteSelection();
                    return;
                }
                if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    selectedIdx = (selectedIdx - 1 + filteredItems.length) % filteredItems.length;
                    updateAutocompleteSelection();
                    return;
                }
                if (e.key === 'Tab' || (e.key === 'Enter' && !e.shiftKey)) {
                    e.preventDefault();
                    applyAutocomplete(filteredItems[selectedIdx] || filteredItems[0]);
                    return;
                }
                if (e.key === 'Escape') {
                    e.preventDefault();
                    hideAutocomplete();
                    return;
                }
            }

            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        messageInput.addEventListener('blur', () => {
            setTimeout(() => hideAutocomplete(), 150);
        });

        agentSelect.addEventListener('change', () => {
            currentAgentId = agentSelect.value;
        });

        // Help button — show all commands
        helpBtn.addEventListener('click', () => {
            if (autocompleteEl.classList.contains('visible')) {
                hideAutocomplete();
            } else {
                filteredItems = COMMANDS.map(c => ({
                    label: c.name,
                    desc: c.desc,
                    insertText: c.name + ' ',
                    kind: 'command',
                    privileged: c.privileged,
                }));
                selectedIdx = 0;
                autocompleteTrigger = 'command';
                renderAutocomplete();
            }
        });

        // ── Autocomplete ──
        function handleAutocomplete() {
            const value = messageInput.value;

            // Command autocomplete
            if (value.startsWith('/') && !value.includes('\n')) {
                const typed = value.split(/\s/)[0].toLowerCase();
                if (!value.includes(' ')) {
                    filteredItems = COMMANDS
                        .filter(c => c.name.startsWith(typed))
                        .map(c => ({
                            label: c.name,
                            desc: c.desc,
                            insertText: c.name + ' ',
                            kind: 'command',
                            privileged: c.privileged,
                        }));
                    if (filteredItems.length > 0) {
                        selectedIdx = 0;
                        autocompleteTrigger = 'command';
                        renderAutocomplete();
                        return;
                    }
                }
            }

            // Agent mention autocomplete (@)
            const atMatch = value.match(/@(\w*)$/);
            if (atMatch && agentNames.length > 0) {
                const search = atMatch[1].toLowerCase();
                filteredItems = agentNames
                    .filter(n => n.toLowerCase().startsWith(search))
                    .map(n => ({
                        label: '@' + n,
                        desc: 'Agent',
                        insertText: '@' + n + ' ',
                        kind: 'agent',
                        privileged: false,
                    }));
                if (filteredItems.length > 0) {
                    selectedIdx = 0;
                    autocompleteTrigger = 'agent';
                    renderAutocomplete();
                    return;
                }
            }

            hideAutocomplete();
        }

        function renderAutocomplete() {
            autocompleteEl.innerHTML = filteredItems.map((item, i) => `
                <div class="autocomplete__item${i === selectedIdx ? ' active' : ''}" data-index="${i}" data-kind="${item.kind}">
                    <span class="autocomplete__name">${item.label}</span>
                    ${item.privileged ? '<span class="autocomplete__badge">owner</span>' : ''}
                    <span class="autocomplete__desc">${item.desc}</span>
                </div>
            `).join('');

            autocompleteEl.querySelectorAll('.autocomplete__item').forEach(el => {
                el.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    const idx = parseInt(el.dataset.index);
                    applyAutocomplete(filteredItems[idx]);
                    messageInput.focus();
                });
                el.addEventListener('mouseenter', () => {
                    selectedIdx = parseInt(el.dataset.index);
                    updateAutocompleteSelection();
                });
            });

            autocompleteEl.classList.add('visible');
        }

        function applyAutocomplete(item) {
            if (!item) return;
            const value = messageInput.value;

            if (autocompleteTrigger === 'command') {
                const rest = value.includes(' ') ? value.slice(value.indexOf(' ')) : '';
                messageInput.value = item.insertText + rest.trimStart();
            } else if (autocompleteTrigger === 'agent') {
                const atIdx = value.lastIndexOf('@');
                messageInput.value = value.slice(0, atIdx) + item.insertText;
            }

            hideAutocomplete();
            messageInput.focus();
        }

        function updateAutocompleteSelection() {
            autocompleteEl.querySelectorAll('.autocomplete__item').forEach((el, i) => {
                el.classList.toggle('active', i === selectedIdx);
            });
        }

        function hideAutocomplete() {
            autocompleteEl.classList.remove('visible');
            selectedIdx = -1;
            filteredItems = [];
            autocompleteTrigger = null;
        }

        // ── Load agents ──
        async function loadAgents() {
            const apiBase = getApiUrl();
            if (!apiBase) {
                agentSelect.innerHTML = '<option value="">Configure server...</option>';
                return;
            }
            try {
                const res = await fetch(`${apiBase}/api/agents`);
                if (!res.ok) throw new Error(res.statusText);
                const agents = await res.json();
                agentNames = agents.map(a => a.name);
                agentSelect.innerHTML = '';

                if (agents.length === 0) {
                    agentSelect.innerHTML = '<option value="">No agents</option>';
                    return;
                }

                const defaultOpt = document.createElement('option');
                defaultOpt.value = '';
                defaultOpt.textContent = 'Select agent...';
                agentSelect.appendChild(defaultOpt);

                for (const agent of agents) {
                    const opt = document.createElement('option');
                    opt.value = agent.id;
                    opt.textContent = agent.name;
                    agentSelect.appendChild(opt);
                }

                // Restore last selection
                const savedAgentId = sessionStorage.getItem('corvid_chat_agentId');
                if (savedAgentId && agents.find(a => a.id === savedAgentId)) {
                    agentSelect.value = savedAgentId;
                    currentAgentId = savedAgentId;
                } else if (agents.length === 1) {
                    agentSelect.value = agents[0].id;
                    currentAgentId = agents[0].id;
                }
            } catch (err) {
                agentSelect.innerHTML = '<option value="">Failed to load</option>';
            }
        }

        // ── WebSocket ──
        function connectWs() {
            const wsUrl = getServerUrl();
            if (!wsUrl) {
                statusDot.className = 'header__status';
                if (!localStorage.getItem('corvid_ws_url')) {
                    settingsModal.classList.add('visible');
                    serverUrlInput.focus();
                }
                return;
            }

            try { ws = new WebSocket(wsUrl); }
            catch { statusDot.className = 'header__status error'; scheduleReconnect(); return; }

            ws.addEventListener('open', () => {
                statusDot.className = 'header__status connected';
                reconnectDelay = 1000;
                appendStatus('Connected');
            });
            ws.addEventListener('close', () => {
                statusDot.className = 'header__status error';
                ws = null;
                scheduleReconnect();
            });
            ws.addEventListener('error', () => {
                statusDot.className = 'header__status error';
            });
            ws.addEventListener('message', (event) => {
                try { handleServerMessage(JSON.parse(event.data)); } catch {}
            });
        }

        function scheduleReconnect() {
            if (reconnectTimer) return;
            reconnectTimer = setTimeout(() => {
                reconnectTimer = null;
                connectWs();
            }, reconnectDelay);
            reconnectDelay = Math.min(reconnectDelay * 1.5, 15000);
        }

        // ── Server message handling ──
        function handleServerMessage(msg) {
            switch (msg.type) {
                case 'chat_thinking':
                    msg.active ? showThinking() : hideThinking();
                    break;

                case 'chat_stream':
                    hideThinking();
                    if (!streamingEl) {
                        streamingEl = appendMsg('', 'outbound', true);
                        streamBuffer = '';
                        isStreaming = true;
                    }
                    streamBuffer += msg.chunk;
                    const textEl = streamingEl.querySelector('.msg__text');
                    renderMarkdown(textEl, streamBuffer);

                    // Show or hide cursor
                    let cursorEl = streamingEl.querySelector('.cursor');
                    if (msg.done) {
                        if (cursorEl) cursorEl.remove();
                        streamingEl.classList.remove('msg--streaming');
                        streamingEl = null;
                        streamBuffer = '';
                        isStreaming = false;
                    } else {
                        if (!cursorEl) {
                            cursorEl = document.createElement('span');
                            cursorEl.className = 'cursor';
                            cursorEl.setAttribute('aria-hidden', 'true');
                            textEl.appendChild(cursorEl);
                        }
                    }
                    scrollToBottom();
                    break;

                case 'chat_tool_use':
                    appendTool(msg.toolName, msg.input || '');
                    break;

                case 'chat_session':
                    // Could show session ID
                    break;

                case 'algochat_message':
                    if (msg.direction === 'outbound') {
                        if (!streamingEl) {
                            const el = appendMsg('', 'outbound');
                            renderMarkdown(el.querySelector('.msg__text'), msg.content);
                        }
                    } else if (msg.direction === 'status') {
                        appendStatus(msg.content);
                    } else {
                        const addr = msg.participant ? msg.participant.slice(0, 8) + '...' : 'unknown';
                        appendStatus(`[${addr}]: ${msg.content}`);
                    }
                    break;

                case 'error':
                    appendStatus('\u26a0 ' + msg.message);
                    isStreaming = false;
                    streamingEl = null;
                    break;

                case 'work_task_update':
                    if (msg.task) {
                        const status = msg.task.status || 'unknown';
                        const branch = msg.task.branchName ? ` (${msg.task.branchName})` : '';
                        const pr = msg.task.prUrl ? ` \u2014 ${msg.task.prUrl}` : '';
                        appendStatus(`Work task ${status}${branch}${pr}`);
                    }
                    break;

                case 'approval_request':
                    if (msg.request) {
                        appendApproval(msg.request);
                    }
                    break;

                case 'council_stage_change':
                    appendStatus(`Council stage: ${msg.stage}`);
                    break;
            }
        }

        // ── Send message ──
        function sendMessage() {
            const content = messageInput.value.trim();
            if (!content || !currentAgentId || isStreaming || !ws || ws.readyState !== WebSocket.OPEN) return;

            hideAutocomplete();
            removeEmptyState();

            // Save agent selection
            sessionStorage.setItem('corvid_chat_agentId', currentAgentId);

            const isCommand = content.startsWith('/');
            appendMsg(content, isCommand ? 'command' : 'inbound');

            ws.send(JSON.stringify({
                type: 'chat_send',
                agentId: currentAgentId,
                content,
            }));

            messageInput.value = '';
            messageInput.style.height = 'auto';
        }

        // ── Markdown renderer ──
        function renderMarkdown(el, text) {
            let html = text
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;');

            // Code blocks
            html = html.replace(/```(\w*)\n([\s\S]*?)```/g, (_, lang, code) => {
                return `<pre><code>${code.trim()}</code></pre>`;
            });

            // Inline code
            html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

            // Tables (simple: | col | col | with header separator)
            html = html.replace(/((?:^\|.+\|$\n?)+)/gm, (tableBlock) => {
                const rows = tableBlock.trim().split('\n');
                if (rows.length < 2) return tableBlock;

                // Check for separator row (|---|---|)
                const sepIdx = rows.findIndex(r => /^\|[\s\-:|]+\|$/.test(r));
                if (sepIdx < 0) return tableBlock;

                let table = '<table>';
                // Header rows (before separator)
                for (let i = 0; i < sepIdx; i++) {
                    const cells = rows[i].split('|').filter((_, ci, arr) => ci > 0 && ci < arr.length - 1);
                    table += '<tr>' + cells.map(c => `<th>${c.trim()}</th>`).join('') + '</tr>';
                }
                // Body rows (after separator)
                for (let i = sepIdx + 1; i < rows.length; i++) {
                    if (!rows[i].trim()) continue;
                    const cells = rows[i].split('|').filter((_, ci, arr) => ci > 0 && ci < arr.length - 1);
                    table += '<tr>' + cells.map(c => `<td>${c.trim()}</td>`).join('') + '</tr>';
                }
                table += '</table>';
                return table;
            });

            // Bold
            html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');

            // Italic
            html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');

            // Headers
            html = html.replace(/^### (.+)$/gm, '<h3>$1</h3>');
            html = html.replace(/^## (.+)$/gm, '<h2>$1</h2>');
            html = html.replace(/^# (.+)$/gm, '<h1>$1</h1>');

            // HR
            html = html.replace(/^---+$/gm, '<hr>');

            // Blockquotes
            html = html.replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>');

            // Links
            html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');

            // Ordered lists
            html = html.replace(/^(\d+)\. (.+)$/gm, '<li data-ol>$2</li>');
            html = html.replace(/(<li data-ol>.*<\/li>\n?)+/g, (match) => `<ol>${match.replace(/ data-ol/g, '')}</ol>`);

            // Unordered lists
            html = html.replace(/^[\-\*] (.+)$/gm, '<li>$1</li>');
            html = html.replace(/(<li>(?:(?!data-ol).)*<\/li>\n?)+/g, (match) => {
                if (match.includes('<ol>')) return match;
                return `<ul>${match}</ul>`;
            });

            // Line breaks (not inside pre)
            html = html.replace(/\n/g, '<br>');
            html = html.replace(/<pre><code>([\s\S]*?)<\/code><\/pre>/g, (_, code) => {
                return `<pre><code>${code.replace(/<br>/g, '\n')}</code></pre>`;
            });

            el.innerHTML = html;
        }

        // ── DOM helpers ──
        function removeEmptyState() {
            if (emptyState && emptyState.parentNode) emptyState.remove();
        }

        function appendMsg(text, direction, raw) {
            removeEmptyState();
            const el = document.createElement('div');
            el.className = `msg msg--${direction}`;
            if (raw) el.classList.add('msg--streaming');

            const promptText = direction === 'inbound' ? '> '
                : direction === 'command' ? '/ '
                : 'assistant> ';

            const prompt = document.createElement('span');
            prompt.className = 'msg__prompt';
            prompt.textContent = promptText;
            el.appendChild(prompt);

            const textEl = document.createElement('span');
            textEl.className = 'msg__text';
            el.appendChild(textEl);

            if (raw) {
                // Will be filled during streaming
            } else if (direction === 'outbound') {
                renderMarkdown(textEl, text);
            } else {
                textEl.textContent = text;
            }

            // Copy button
            const copyBtn = document.createElement('button');
            copyBtn.className = 'msg__copy';
            copyBtn.textContent = 'cp';
            copyBtn.setAttribute('aria-label', 'Copy message');
            copyBtn.addEventListener('click', () => {
                const content = raw ? streamBuffer : text;
                navigator.clipboard.writeText(content || textEl.textContent);
                copyBtn.textContent = '\u2713';
                setTimeout(() => copyBtn.textContent = 'cp', 1500);
            });
            el.appendChild(copyBtn);

            outputEl.appendChild(el);
            scrollToBottom();
            return el;
        }

        function appendStatus(text) {
            removeEmptyState();
            const el = document.createElement('div');
            el.className = 'msg msg--status';
            const prompt = document.createElement('span');
            prompt.className = 'msg__prompt';
            prompt.textContent = '... ';
            el.appendChild(prompt);
            const textEl = document.createElement('span');
            textEl.className = 'msg__text';
            textEl.textContent = text;
            el.appendChild(textEl);
            outputEl.appendChild(el);
            scrollToBottom();
        }

        function appendTool(toolName, input) {
            removeEmptyState();
            const details = document.createElement('details');
            details.className = 'tool';

            const summary = document.createElement('summary');
            summary.className = 'tool__name';
            summary.textContent = `tool: ${toolName}`;
            details.appendChild(summary);

            if (input) {
                const pre = document.createElement('pre');
                pre.className = 'tool__input';
                try {
                    pre.textContent = typeof input === 'string' ? input : JSON.stringify(JSON.parse(input), null, 2);
                } catch {
                    pre.textContent = String(input);
                }
                details.appendChild(pre);
            }

            outputEl.appendChild(details);
            scrollToBottom();
        }

        function appendApproval(request) {
            removeEmptyState();
            const el = document.createElement('div');
            el.className = 'approval';

            const text = document.createElement('div');
            text.className = 'approval__text';
            text.textContent = '\uD83D\uDFE1 ' + (request.description || 'Approval needed');
            el.appendChild(text);

            const actions = document.createElement('div');
            actions.className = 'approval__actions';

            const approveBtn = document.createElement('button');
            approveBtn.className = 'approval__btn approval__btn--approve';
            approveBtn.textContent = 'Approve';
            approveBtn.addEventListener('click', () => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'approval_response',
                        requestId: request.id,
                        behavior: 'allow',
                    }));
                    el.style.opacity = '0.5';
                    approveBtn.disabled = true;
                    denyBtn.disabled = true;
                    text.textContent += ' \u2014 Approved';
                }
            });
            actions.appendChild(approveBtn);

            const denyBtn = document.createElement('button');
            denyBtn.className = 'approval__btn approval__btn--deny';
            denyBtn.textContent = 'Deny';
            denyBtn.addEventListener('click', () => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    ws.send(JSON.stringify({
                        type: 'approval_response',
                        requestId: request.id,
                        behavior: 'deny',
                    }));
                    el.style.opacity = '0.5';
                    approveBtn.disabled = true;
                    denyBtn.disabled = true;
                    text.textContent += ' \u2014 Denied';
                }
            });
            actions.appendChild(denyBtn);

            el.appendChild(actions);
            outputEl.appendChild(el);
            scrollToBottom();
        }

        let thinkingEl = null;
        function showThinking() {
            if (thinkingEl) return;
            removeEmptyState();
            thinkingEl = document.createElement('div');
            thinkingEl.className = 'thinking';
            thinkingEl.setAttribute('aria-label', 'Agent is thinking');
            thinkingEl.innerHTML = '<span class="thinking__dot"></span><span>thinking...</span>';
            outputEl.appendChild(thinkingEl);
            scrollToBottom();
        }
        function hideThinking() {
            if (thinkingEl) { thinkingEl.remove(); thinkingEl = null; }
        }

        function scrollToBottom() {
            requestAnimationFrame(() => {
                outputEl.scrollTop = outputEl.scrollHeight;
            });
        }

        // ── Initialize ──
        function init() {
            const wsUrl = getServerUrl();
            if (wsUrl) {
                if (!getApiUrl()) {
                    const apiBase = deriveApiUrl(wsUrl);
                    if (apiBase) localStorage.setItem('corvid_api_url', apiBase);
                }
                connectWs();
                loadAgents();
            } else {
                settingsModal.classList.add('visible');
                serverUrlInput.focus();
            }
        }

        init();
    })();
    </script>
</body>
</html>
